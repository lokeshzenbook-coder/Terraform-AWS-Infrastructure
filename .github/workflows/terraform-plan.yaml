name: "Terraform Plan"

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform-plan.yaml"

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}

jobs:

  # ---------------------------------------------------
  # Detect which environments changed
  # ---------------------------------------------------
  detect-changes:
    name: "Detect Changed Environments"
    runs-on: ubuntu-latest
    outputs:
      # JSON array of changed environment names, e.g. ["dev","prod"]
      matrix: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dev:
              - 'environments/dev/**'
              - 'modules/**'
            staging:
              - 'environments/staging/**'
              - 'modules/**'
            prod:
              - 'environments/prod/**'
              - 'modules/**'

  # ---------------------------------------------------
  # Stage 1: GitLeaks - secret scanning
  # ---------------------------------------------------
  gitleaks:
    name: "Stage 1 - GitLeaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------
  # Stage 2: Terraform fmt
  # ---------------------------------------------------
  fmt:
    name: "Stage 2 - Terraform fmt"
    needs: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
      - name: terraform fmt (auto-fix)
        run: terraform fmt -recursive
      - name: Commit and push formatting fixes
        env:
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: terraform fmt auto-fix [skip ci]"
            git push origin "HEAD:${TARGET_REF}"
          else
            echo "No formatting changes needed."
          fi

  # ---------------------------------------------------
  # Stage 3: TFLint
  # ---------------------------------------------------
  tflint:
    name: "Stage 3 - TFLint"
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: Init TFLint
        run: tflint --init
      - name: Run TFLint
        run: tflint -f compact

  # ---------------------------------------------------
  # Stage 4: Checkov
  # ---------------------------------------------------
  checkov:
    name: "Stage 4 - Checkov"
    needs: tflint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results.sarif
      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results.sarif

  # ---------------------------------------------------
  # Stage 5: tfsec
  # ---------------------------------------------------
  tfsec:
    name: "Stage 5 - tfsec"
    needs: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true

  # ---------------------------------------------------
  # Stage 6: Terrascan
  # ---------------------------------------------------
  terrascan:
    name: "Stage 6 - Terrascan"
    needs: tfsec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Terrascan
        uses: tenable/terrascan-action@main
        with:
          iac_type: terraform
          policy_type: aws
          only_warn: false
          sarif_upload: true
          # Public web SG intentionally exposes 80/443 (AC_AWS_0228/0229)
          skip_rules: |
            AC_AWS_0228
            AC_AWS_0229

  # ---------------------------------------------------
  # Plan (per changed environment)
  # ---------------------------------------------------
  plan:
    name: "Plan - ${{ matrix.env }}"
    needs: [terrascan, detect-changes]
    # NOTE: the matrix context is not available in job-level `if`,
    # so the changed environments are fed into the matrix itself.
    if: needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -out=tfplan -input=false -detailed-exitcode
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes present (ok), 1 = real error
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          exit 0

      - name: Export plan as JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: |
            environments/${{ matrix.env }}/tfplan
            environments/${{ matrix.env }}/tfplan.json
          retention-days: 5

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/${{ matrix.env }}/tfplan.json', 'utf8');
            const planJSON = JSON.parse(plan);
            let output = `### Terraform Plan - \`${{ matrix.env }}\`\n\n`;
            const create = planJSON.resource_changes.filter(c => c.change.actions.includes('create'));
            const update = planJSON.resource_changes.filter(c => c.change.actions.includes('update'));
            const destroy = planJSON.resource_changes.filter(c => c.change.actions.includes('destroy'));
            output += `| Action | Count |\n|--------|-------|\n`;
            output += `| Create | ${create.length} |\n`;
            output += `| Update | ${update.length} |\n`;
            output += `| Destroy | ${destroy.length} |\n\n`;
            if (destroy.length > 0) {
              output += `> :warning: **${destroy.length} resource(s) will be destroyed**\n\n`;
            }
            const body = output;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

  # ---------------------------------------------------
  # Infracost (only for changed envs)
  # ---------------------------------------------------
  infracost:
    name: "Infracost - ${{ matrix.env }}"
    needs: [plan, detect-changes]
    if: needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
      - name: Setup Infracost
        if: ${{ env.INFRACOST_API_KEY != '' }}
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Terraform Init
        if: ${{ env.INFRACOST_API_KEY != '' }}
        working-directory: environments/${{ matrix.env }}
        run: terraform init -backend=false
      - name: Generate Infracost cost estimate
        if: ${{ env.INFRACOST_API_KEY != '' }}
        working-directory: environments/${{ matrix.env }}
        run: infracost breakdown --path . --format json --out-file /tmp/infracost-${{ matrix.env }}.json
      - name: Post Infracost comment
        if: ${{ env.INFRACOST_API_KEY != '' && github.event_name == 'pull_request' }}
        run: |
          infracost comment github --path /tmp/infracost-${{ matrix.env }}.json \
            --repo "$GITHUB_REPOSITORY" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --behavior update

  # ---------------------------------------------------
  # OPA Policy (per changed environment)
  # ---------------------------------------------------
  opa_policy:
    name: "OPA Policy - ${{ matrix.env }}"
    needs: [plan, detect-changes]
    if: needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: environments/${{ matrix.env }}
      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Run OPA evaluation
        working-directory: environments/${{ matrix.env }}
        run: |
          opa eval --format raw \
            --data ../../policy/terraform.rego \
            --input tfplan.json \
            "data.terraform.policy.deny" > opa-deny.json
          echo "OPA policy denials:"
          cat opa-deny.json
          result="$(cat opa-deny.json)"
          # empty result or [] => compliant, otherwise violations found
          if [ -n "$result" ] && [ "$result" != "[]" ]; then
            echo "::error::OPA policy violations found"
            exit 1
          fi
